<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Case Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181b28;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance {
            font-size: 18px;
            background: #222639;
            padding: 8px 15px;
            border-radius: 8px;
            color: #2ed573;
            font-weight: bold;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #181b28;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        /* Рулетка со скинами */
        .roulette-window {
            position: relative;
            width: 100%;
            height: 140px;
            background: #11131c;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid #282d42;
        }
        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ff4757;
            z-index: 10;
            box-shadow: 0 0 10px #ff4757;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: left 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        .skin-card {
            min-width: 120px;
            height: 140px;
            background: #222639;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-right: 2px solid #181b28;
        }
        .skin-card img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }
        .skin-name {
            font-size: 12px;
            color: #a4b0be;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        /* Редкость скинов */
        .rarity-common { border-bottom: 4px solid #707070; }
        .rarity-rare { border-bottom: 4px solid #3b82f6; }
        .rarity-epic { border-bottom: 4px solid #a855f7; }
        .rarity-legendary { border-bottom: 4px solid #eab308; }

        .btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            margin-top: 15px;
            text-transform: uppercase;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }
        .btn:disabled {
            background: #4b4b4b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .result-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CS:GO Case Battle</div>
        <div class="balance">Баланс: <span id="balance">1000</span> ₽</div>
    </header>

    <div class="container">
        <h2>Оружейный Кейс #1</h2>
        <p style="color: #747d8c; margin-top: 5px;">Стоимость открытия: 150 ₽</p>

        <!-- Окно рулетки -->
        <div class="roulette-window">
            <div class="roulette-pointer"></div>
            <div class="roulette-track" id="track"></div>
        </div>

        <button class="btn" id="openBtn" onclick="openCase()">Открыть кейс</button>
        <div class="result-text" id="resultText"></div>
    </div>

    <script>
        // Список доступных скинов с реальными картинками из открытых источников CDN
        const skins = [
            { name: "P250 | Песчаная дюна", price: 10, rarity: "common", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot621FABz7PLfYQJD_9W7m5O0m_7zO6_um1Rd6ct0j9bN8onzjFWx-ktqa2-iJtSRdwZvYwqDqVW-ye3vjMW5vp6YzHc373En7GqMl0a-101HPayh/360fx360f" },
            { name: "AK-47 | Сафари сет", price: 40, rarity: "common", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV092lnYmOhOTLPr7Vj35cppRz2r2Tptqi3lKx_hc4YmD0J4_BcAA3Zg7Zqle3k-_mg5a6vprPzyVl7CJ2sH7UmUa_00kca7Nrhu6A/360fx360f" },
            { name: "M4A4 | Отрешение", price: 120, rarity: "rare", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpou-6kejhz2v_Nfz5H_uO1gb-Gw_alIITCl3wev5V1j-vIoImn2AXkqkVuazqicNWRIQU8N1uC-1a7kuq8gpXru8yfz3NnvXZ25HaOzBOy005LNuNqhuw/360fx360f" },
            { name: "AWP | Морской вор", price: 350, rarity: "epic", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot621FBRw7P7NcIQh7v-JmImMn-O6OrzZghUC68Bz3b2UooztjgO3_kVoN2_xLI6ddgM3YlzV_Fm7xLro1ce_6pudySZkuicr5yremhCzhxlEcuJt2v7JWQ/360fx360f" },
            { name: "Karambit | Водная струя", price: 2500, rarity: "legendary", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpotuKkFABz7PLfYQJD_9W7m5O0m_7zO6_um1Rd6ct0j9bN8onzjFWx-ktqa2-iJtSRdwZvYwqDqVW-ye3vjMW5vp6YzHc373En7GqMl0a-101HPayh/360fx360f" }
        ];

        let balance = 1000;
        const casePrice = 150;
        const track = document.getElementById('track');
        const balanceEl = document.getElementById('balance');
        const openBtn = document.getElementById('openBtn');
        const resultText = document.getElementById('resultText');

        // Функция генерации случайного скина с весом редкости
        function getRandomSkin() {
            const rand = Math.random() * 100;
            if (rand < 55) return skins[0]; // 55% шанс
            if (rand < 80) return skins[1]; // 25% шанс
            if (rand < 93) return skins[2]; // 13% шанс
            if (rand < 98.5) return skins[3]; // 5.5% шанс
            return skins[4]; // 1.5% шанс (легендарка)
        }

        // Инициализация начальной ленты рулетки
        function initTrack() {
            track.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const skin = getRandomSkin();
                const card = document.createElement('div');
                card.className = `skin-card rarity-${skin.rarity}`;
                card.innerHTML = `
                    <img src="${skin.img}" alt="${skin.name}">
                    <div class="skin-name">${skin.name}</div>
                `;
                track.appendChild(card);
            }
            track.style.left = '0px';
        }

        initTrack();

        function openCase() {
            if (balance < casePrice) {
                alert("Недостаточно средств на балансе!");
                return;
            }

            // Списываем баланс
            balance -= casePrice;
            balanceEl.innerText = balance;
            openBtn.disabled = true;
            resultText.innerText = "Крутим рулетку...";
            resultText.style.color = "#ffa502";

            // Генерируем победный элемент ближе к концу ленты (например, на 35 позиции)
            initTrack();
            const winningIndex = 35;
            const winningSkin = getRandomSkin();
            
            // Подменяем карточку на победную
            const cards = track.children;
            cards[winningIndex].className = `skin-card rarity-${winningSkin.rarity}`;
            cards[winningIndex].innerHTML = `
                <img src="${winningSkin.img}" alt="${winningSkin.name}">
                <div class="skin-name">${winningSkin.name}</div>
            `;

            // Вычисляем смещение рулетки так, чтобы указатель точно попал по центру нужной карточки
            // Каждая карточка шириной 120px. Окно рулетки имеет ширину (допустим, центрируем по 400px или по центру родителя).
            const cardWidth = 120;
            const windowWidth = document.querySelector('.roulette-window').offsetWidth;
            const offset = (winningIndex * cardWidth) - (windowWidth / 2) + (cardWidth / 2) + (Math.random() * 40 - 20);

            track.style.left = `-${offset}px`;

            // Ожидание окончания анимации (4 секунды)
            setTimeout(() => {
                balance += winningSkin.price;
                balanceEl.innerText = balance;
                resultText.innerHTML = `Вы выиграли: <span style="color: #2ed573;">${winningSkin.name}</span> (${winningSkin.price} ₽)`;
                openBtn.disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
